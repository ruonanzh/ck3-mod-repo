# Maintainer hooks for this repository. They cover the environment only, never your_mods/.
#
# lefthook is not installed here yet, so these hooks do not run. Until it is, run the two commands
# by hand before a documentation commit: both are fast and neither needs the game.
#
# The mod checks live in .pi/extensions/mod-lint.ts and the agent runs them through the validate_mod
# tool. A maintainer checks reference/example_mod/ the same way: open the repository in pi and call
# validate_mod. A hook must reuse that check, so the repository never holds two versions of it.
#
# pre-commit:
#   commands:
#     doc-refs:
#       run: node scripts/check-doc-refs.mjs
#     md-lines:
#       run: node scripts/check-md-lines.mjs
